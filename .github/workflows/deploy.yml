name: Deploy ke VPS

# Produksi hidup di VPS dan mengikuti `main`. Vercel tetap melayani `development`
# sebagai staging, jadi push ke sana sengaja tidak memicu apa pun di sini.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Frontend dibangun di sini, bukan di VPS. Mesin produksi 1 core / 2 GB tidak
      # perlu menjalankan Vite sama sekali, dan kode yang gagal type-check berhenti
      # di langkah ini — sebelum menyentuh apa pun di server.
      - name: Build frontend
        working-directory: client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npx tsc -b
          npm run lint
          npm run build

      # Host key diambil langsung dari server tiap deploy, bukan dari secret. Menyalin
      # entri known_hosts lewat tangan terlalu mudah rusak — kunci RSA terpotong jadi
      # beberapa baris saat disalin, dan SSH menolak file yang tidak satu baris per entri.
      # Konsekuensinya kita percaya host apa adanya saat koneksi pertama tiap run; untuk
      # VPS ber-IP tetap yang hanya dihubungi dari GitHub Actions, itu pertukaran yang wajar.
      - name: Siapkan SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # stderr tidak lagi dibuang. Dengan `bash -e`, ssh-keyscan yang gagal menghentikan
          # langkah ini, dan membuang pesannya menyisakan "exit code 1" tanpa keterangan —
          # itu sudah sekali memakan waktu untuk didiagnosis.
          # Satu kegagalan juga belum tentu berarti VPS mati: jalur runner GitHub ke
          # Rumahweb sesekali meleset, jadi dicoba beberapa kali sebelum menyerah.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -t ed25519,rsa "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan percobaan $i gagal, ulangi dalam 10 detik"
            sleep 10
          done

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan tidak menghasilkan satu entri pun — VPS tidak terjangkau dari runner. Pastikan VPS_HOST berisi IP, bukan nama domain."
            exit 1
          fi
          wc -l < ~/.ssh/known_hosts | xargs -I{} echo "known_hosts: {} entri"

      # Urutannya bukan selera: `git reset --hard` menghapus client/dist (folder itu
      # ada di .gitignore), jadi hasil build harus dikirim SESUDAH langkah ini.
      - name: Perbarui backend
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /srv/katiga && git fetch --prune origin main && git reset --hard origin/main && npm ci --omit=dev'

      - name: Kirim hasil build
        run: |
          # --delay-updates: semua berkas baru ditahan di direktori sementara lalu
          # dipindahkan sekaligus di akhir. Tanpa ini rsync menulis di tempatnya langsung,
          # dan permintaan yang tiba di tengah proses mendapat berkas separuh jadi — 500.
          #
          # --delete SENGAJA TIDAK DIPAKAI. Nama aset Vite mengandung hash, jadi berkas
          # lama tidak pernah bentrok dengan yang baru. Tapi pengunjung yang memuat
          # index.html beberapa detik sebelum deploy akan meminta nama-aset LAMA; kalau
          # sudah dihapus, halamannya putih sampai mereka memuat ulang. Membiarkan aset
          # lama menumpuk jauh lebih murah daripada itu — ukurannya ratusan KB per rilis.
          # Kalau suatu saat perlu dipangkas, hapus manual yang tidak lagi dirujuk.
          rsync -az --delay-updates -e "ssh -i ~/.ssh/id_ed25519" \
            client/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/katiga/client/dist/

      - name: Reload aplikasi
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'pm2 reload katiga --update-env && pm2 save'

      # pm2 berjalan di mode fork dengan satu instance, jadi `reload` sebenarnya restart:
      # ada jeda satu-dua detik sebelum Node mengikat port 8000 lagi. Pemeriksaan sekali
      # jalan menabrak jeda itu dan melaporkan deploy gagal padahal rilisnya sukses —
      # status merah yang keliru lebih berbahaya daripada tidak ada pemeriksaan, karena
      # membuat merah berhenti dipercaya.
      - name: Pastikan aplikasi menjawab
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            for i in $(seq 1 15); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/products || true)
              if [ "$code" = "200" ]; then
                echo "aplikasi menjawab 200 pada percobaan ke-$i"
                exit 0
              fi
              sleep 2
            done
            echo "aplikasi tidak menjawab 200 setelah 30 detik (terakhir: ${code:-000})"
            exit 1
          '
