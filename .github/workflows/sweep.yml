name: Sapuan terjadwal

# Sapuan ini menyusul webhook Mayar/Biteship yang meleset, jadi telat sehari terlalu lama.
# Paket Vercel Hobby menolak jadwal cron di bawah sekali sehari — deployment-nya gagal, bukan
# cuma cron-nya yang tidak jalan — jadi kadensi 15 menitnya dipindah ke sini. Vercel Cron
# tetap dipasang sebagai jaring kedua yang harian (lihat "crons" di vercel.json), berguna
# kalau GitHub menonaktifkan jadwal ini karena repo lama tidak ada aktivitas.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/cron/sweep
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://katiga-website.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET belum diset sebagai repository secret"
            exit 1
          fi

          response=$(curl -sS --max-time 300 -w '\n%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/sweep")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::sapuan menjawab HTTP $status"
            exit 1
          fi

          case "$body" in
            *'"ok":false'*)
              echo "::error::ada sapuan yang gagal, lihat balasan di atas"
              exit 1
              ;;
          esac
